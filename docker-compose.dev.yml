services:
    postgres:
        image: postgres:17.6
        command:
            [
                "postgres",
                "-c",
                "max_connections=300",
                "-c",
                "shared_buffers=256MB",
            ]
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network

    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        container_name: s3minio-mehmetdogandev
        command: server /data --console-address ":9001"
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "${MINIO_API_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        volumes:
            - minio_storage:/data
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - app-network

    drizzle-gateway:
        image: ghcr.io/drizzle-team/gateway:latest
        container_name: drizzle_gateway_mehmetdogandev_local
        restart: unless-stopped
        ports:
            - "${DRIZZLE_GATEWAY_PORT:-4983}:4983"
        environment:
            - PORT=4983
            - STORE_PATH=/app
            - MASTERPASS=${DRIZZLE_GATEWAY_PASSWORD:-admin123}
            - DATABASE_URL_main=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-network
        volumes:
            - drizzle_gateway_data:/app
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4983/health"]
            interval: 30s
            timeout: 10s
            retries: 3

    redis:
        image: redis:7-alpine
        container_name: mehmetdogandev-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network

volumes:
    postgres_data:
    minio_storage:
    drizzle_gateway_data:
    redis_data:

networks:
    app-network:
        driver: bridge
